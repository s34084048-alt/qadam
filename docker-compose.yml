name: qadam

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qadam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qadam-secret}
      POSTGRES_DB: ${POSTGRES_DB:-qadam}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qadam}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-qadam}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-qadam-secret}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "9000:9000"
      - "9001:9001"

  createbucket:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-qadam} ${S3_SECRET_KEY:-qadam-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-qadam-images} &&
      mc anonymous set none local/${S3_BUCKET:-qadam-images} &&
      echo 'bucket ready (private)'
      "

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qadam}:${POSTGRES_PASSWORD:-qadam-secret}@db:5432/${POSTGRES_DB:-qadam}
      AUTO_CREATE_SCHEMA: "false"
      RUN_MIGRATIONS: "true"
      SEED_ON_START: "${SEED_ON_START:-true}"
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-qadam-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-qadam}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-qadam-secret}
      S3_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: "http://localhost:5173,http://localhost:8080"
      DATA_RESIDENCY: ${DATA_RESIDENCY:-UAE}
      ANALYSIS_RUNNER: inline
    ports:
      - "8000:8000"

  web:
    build: ./web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  db-data:
  minio-data:
