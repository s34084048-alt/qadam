# QADAM — deployment blueprint for a container host (Render).
#
# The API is a stateful, CPU-bound, container-shaped service: it imports
# OpenCV, holds a database connection pool, and spends real CPU on every
# analysis. That is why it goes on a container host rather than on serverless
# functions, where the dependency bundle would be at the size limit and a cold
# start would land on top of the analysis time.
#
# Every secret below is GENERATED by the host. None of the repository's default
# credentials survive the trip: app/config.py refuses to start when they do.
#
#   Render → New → Blueprint → point at this repository.
#
# NOT A MEDICAL DEVICE. Anything reachable at the resulting URL is on the
# public internet. Seed synthetic data only.

databases:
  - name: qadam-db
    databaseName: qadam
    user: qadam
    plan: free          # free Postgres is DELETED after 30 days

services:
  - type: web
    name: qadam-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free         # sleeps after ~15 min idle; ~1 min cold start
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: prod        # hides the demo-account panel in the web UI
      - key: DATABASE_URL
        fromDatabase:
          name: qadam-db
          property: connectionString
      - key: RUN_MIGRATIONS
        value: "true"
      - key: AUTO_CREATE_SCHEMA
        value: "false"     # prod uses Alembic, never create_all
      - key: SEED_ON_START
        value: "true"      # synthetic demo cases only

      # Generated once by the host and never printed in this repository.
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_CLINICIAN_PASSWORD
        generateValue: true

      - key: SEED_ADMIN_EMAIL
        value: admin@qadam.app
      - key: SEED_CLINICIAN_EMAIL
        value: clinician@qadam.app

      # Images live on the instance's own filesystem, which is EPHEMERAL: they
      # do not survive a restart or a redeploy. Acceptable for a demo and
      # nothing else. For anything durable, attach a disk or point
      # STORAGE_BACKEND=s3 at Cloudflare R2 / S3 and set the S3_* variables.
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /tmp/qadam-storage

      # The web app is served from Vercel and proxies /api to this service on
      # its own origin, so requests are same-origin and no bearer token ever
      # crosses an origin boundary. CORS stays closed on purpose.
      - key: CORS_ORIGINS
        value: ""
      - key: DATA_RESIDENCY
        value: UAE
      - key: ANALYSIS_RUNNER
        value: inline
