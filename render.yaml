# QADAM — one free service, one URL.
#
# ONE service, not two. The root Dockerfile builds the web bundle and the API
# into a single image and serves both from the same origin, so there is no
# second host to pay for, no CORS, and no bearer token crossing an origin
# boundary.
#
# NO DATABASE SERVICE. Render's free Postgres is deleted after 30 days, which
# is not a permanent link — it is a link with an expiry date. This runs on
# SQLite inside the instance instead. That is EPHEMERAL: every case, image and
# answer is lost when the service restarts, and SEED_ON_START refills it with
# synthetic cases. Acceptable for a demo and for nothing else. For durability,
# add a managed database and set DATABASE_URL, or point STORAGE_BACKEND=s3 at
# Cloudflare R2.
#
#   Render → New → Blueprint → point at this repository.
#
# NOT A MEDICAL DEVICE. Anything reachable at the resulting URL is on the
# public internet. Seed synthetic data only.

services:
  - type: web
    name: qadam
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Free: sleeps after ~15 minutes idle, and the next request waits roughly
    # a minute while the container starts. 512 MB, which one worker and one
    # resident copy of OpenCV fit inside.
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: prod        # hides the demo-account panel in the web UI
      - key: WEB_CONCURRENCY
        value: "1"

      # Generated once by the host. None of the repository's default
      # credentials survive the trip: app/config.py refuses to start on them,
      # and they are published in this repository.
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_CLINICIAN_PASSWORD
        generateValue: true

      - key: SEED_ADMIN_EMAIL
        value: admin@qadam.app
      - key: SEED_CLINICIAN_EMAIL
        value: clinician@qadam.app

      # Everything else — SQLite path, local storage, migrations, seeding and
      # SERVE_WEB_DIR — is set in the Dockerfile, so this file stays about
      # the host and the secrets.
